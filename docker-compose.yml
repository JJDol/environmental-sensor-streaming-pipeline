services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  producer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: environmental-readings
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCER_INTERVAL_SECONDS: 2
      SENSOR_DATA_FILE: /app/data/sample_environmental_readings.csv
    command: ["python", "-m", "src.producer"]

  consumer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      KAFKA_TOPIC: environmental-readings
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: municipal_environment
      MONGO_COLLECTION: sensor_readings
    command: ["python", "-m", "src.consumer"]

volumes:
  mongo-data:
